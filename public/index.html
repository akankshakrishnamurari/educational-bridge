<!DOCTYPE html>
<!-- lang is en-IN rather than en: the audience, spelling and number formatting
     (see formatCount, which uses Indian digit grouping) are all Indian English. -->
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />

    <!-- The previous description claimed the site "analyses 24 years of real JEE
         Main papers to show you which topics are actually tested, how often, and
         why you keep getting them wrong". None of that analysis exists in the
         product, so it was promising something a visitor would arrive and not
         find. This describes what is actually here. -->
    <meta
      name="description"
      content="A free, non-profit question bank for competitive exam preparation. Practise questions tagged by subject, chapter, topic and difficulty, with worked solutions and timed papers."
    />
    <!-- Was content="same-origin-allow-popups", which is a Cross-Origin-Opener-Policy
         value, not a referrer policy. Every browser rejected it, logged
         "Failed to set referrer policy" to the console on every page load, and fell
         back to its default. strict-origin-when-cross-origin is that default made
         explicit: full URL to our own origin, origin only to third parties, nothing
         at all on an HTTPS-to-HTTP downgrade. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Link previews. Without these, every link shared to WhatsApp, Telegram or
         X renders as a bare URL with no title, image or description, which is how
         most of this audience will first encounter the site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EducationalBridge" />
    <meta property="og:title" content="EducationalBridge — free practice for competitive exams" />
    <meta
      property="og:description"
      content="A free, non-profit question bank. Practise by subject, chapter, topic and difficulty, with worked solutions and timed papers."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EducationalBridge — free practice for competitive exams" />
    <meta
      name="twitter:description"
      content="A free, non-profit question bank. Practise by subject, chapter, topic and difficulty, with worked solutions and timed papers."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>EducationalBridge — free practice for competitive exams</title>
    <script src="https://accounts.google.com/gsi/client" id="gsi-client"  defer></script>
  </head>
  <body>
    <noscript>
      EducationalBridge needs JavaScript to run. Please enable JavaScript in your
      browser settings and reload this page.
    </noscript>
    <div id="root"></div>
  </body>
</html>
